<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html

    # ── Trust the Caddy TLS proxy (docker-compose.prod.yml) ──────────────────
    # 1) Map the proxy's X-Forwarded-Proto onto PHP's $_SERVER['HTTPS'] so the
    #    app emits HSTS, sets Secure cookies, and otherwise behaves as HTTPS.
    #    (Caddy sends X-Forwarded-Proto: https for every proxied request.)
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # 2) Restore the real client IP for login throttling & audit logging.
    #    Caddy sets X-Forwarded-For; only trust the container networks it can
    #    come from. The app is bound to 127.0.0.1 in prod, so remote IPs only
    #    ever arrive through the proxy.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 127.0.0.1
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 10.0.0.0/8

    <Directory /var/www/html>
        # The app ships a .htaccess (mod_rewrite pretty URLs for /verify/<hash>,
        # browser caching headers). Must be honored.
        AllowOverride All
        Require all granted
        Options Indexes FollowSymLinks
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>