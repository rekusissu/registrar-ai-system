# =============================================================================
#  Build & push the Regristrar AI app image to GitHub Container Registry (GHCR)
#
#  Keeps the heavy PHP-extension compilation OFF the VPS. Runs on GitHub's
#  runners after every change to `main`, and tags the image so `deploy.sh`
#  can pull a prebuilt artifact instead of `docker compose --build`.
#
#  Tags published:
#    ghcr.io/rekusissu/registrar-ai:latest   (latest build of main)
#    ghcr.io/rekusissu/registrar-ai:main
#    ghcr.io/rekusissu/registrar-ai:git-<sha>   (unique per commit)
#    ghcr.io/rekusissu/registrar-ai:<semver>    (on a v* tag)
# =============================================================================

name: docker-image

on:
  push:
    branches: [ main, '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/rekusissu/registrar-ai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # BuildKit / multi-stage needs Buildx for good caching of the base.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only attempt registry login when triggered from the main repo
      # (PRs from forks have no credentials and just need a build check).
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Compute the tag list. Always publish :latest + :main + :git-<sha>;
      # on a semver tag, add the tag itself (e.g. v1.2.3).
      - name: Compute image tags
        id: meta
        run: |
          base="${{ env.IMAGE_NAME }}"
          sha="${GITHUB_SHA::12}"
          TAGS="${base}:latest,${base}:main,${base}:git-${sha}"
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            TAGS="${TAGS},${base}:${{ github.ref_name }}"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Compile is capped in the Dockerfile, but keep a sane limit here too.
          build-args: |
            BUILDKIT_INLINE_CACHE=1