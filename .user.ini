; ============================================================
;  .user.ini — per-directory PHP settings for SHARED HOSTING
;
;  Read by PHP-FPM / CGI on cPanel, Plesk and most Linux shared hosts. It does
;  nothing under Apache's mod_php, and nothing under CLI - the .htaccess at the
;  repository root carries an equivalent block for that case.
;
;  WHY max_execution_time IS 180 AND NOT 30
;
;  Generating an AI Insight report is a synchronous call to an upstream model
;  that was MEASURED at 40-65 seconds against the current primary (a reasoning
;  model; the reasoning pass is most of the wall clock). The default 30s limit
;  kills the script partway through the response: the browser gets a truncated
;  body, the JSON never parses, and the page reports only that the analysis
;  "failed" without naming the cause.
;
;  Raising this is what stops that. If a host refuses the value - some do, and
;  some cap it - then the report cannot be generated synchronously on that host
;  and the fix belongs in the host panel, not here.
;
;  memory_limit is left at the PHP default on purpose. The report is text plus a
;  fact bundle; it does not need headroom, and raising it only makes an OOM kill
;  take longer to arrive.
; ============================================================
max_execution_time = 180

; Do not buffer the whole response in PHP's output layer: a minute-long request
; that is streamed is observably better for the reader than one that appears all
; at once, or not at all.
output_buffering = Off